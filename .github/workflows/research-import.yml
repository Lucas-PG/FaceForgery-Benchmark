name: Import pinned research history
on:
  push:
    branches: [robust-generalization]
    paths: ['.github/workflows/research-import.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  import:
    if: github.repository == 'Lucas-PG/FaceForgery-Benchmark' && github.ref == 'refs/heads/robust-generalization'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Merge the previously reviewed fork-only research branch
        env:
          PRIOR: ca0766e3fcd1c94f10d05b1b020361db74352f59
          UPSTREAM: f00475116eb350aca8d6dbd08df999ab6f21991a
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'Lucas-PG/FaceForgery-Benchmark'
          test "$GITHUB_REF" = 'refs/heads/robust-generalization'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge-base --is-ancestor "$UPSTREAM" HEAD
          git merge --no-edit "$PRIOR"
          mkdir -p research/robustness
          python - <<'PY'
          import json, pathlib, subprocess
          p = pathlib.Path('research/robustness/import.json')
          record = {
            'upstream_repository_read_only': 'lucasdocunha/FaceForgery-Benchmark',
            'upstream_branch': 'ICLR',
            'upstream_commit': 'f00475116eb350aca8d6dbd08df999ab6f21991a',
            'upstream_tree': '08440582235751250ff31733b492935fc1b7c9e7',
            'preserved_fork_research_commit': 'ca0766e3fcd1c94f10d05b1b020361db74352f59',
            'destination_repository': 'Lucas-PG/FaceForgery-Benchmark',
            'destination_branch': 'robust-generalization',
            'base_branch_for_review': 'ICLR',
            'policy': 'No writes to upstream, main, ICLR or explicability. No force push. No GPU experiments.'
          }
          p.write_text(json.dumps(record, indent=2)+'\n')
          print(json.dumps(record, indent=2))
          names = subprocess.check_output(['git','ls-files'],text=True).splitlines()
          print('\nSOURCE INVENTORY\n'+'\n'.join(n for n in names if n.endswith(('.py','.yaml','.md','.tex','.json')) and not n.startswith('figures/')))
          print('\nAGENT INSTRUCTIONS\n')
          for n in names:
              if pathlib.Path(n).name == 'AGENTS.md': print(n, pathlib.Path(n).read_text())
          PY
          git add research/robustness/import.json
          git diff --cached --quiet || git commit -m 'docs: record immutable upstream and preserved explicability provenance'
          REMOTE=$(git ls-remote origin refs/heads/robust-generalization | cut -f1)
          test "$REMOTE" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/robust-generalization
