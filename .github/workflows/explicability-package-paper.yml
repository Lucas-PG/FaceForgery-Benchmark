name: Package explicability manuscript
on:
  push:
    branches: [explicability]
    paths: ['.github/workflows/explicability-package-paper.yml']
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Explicability paper build run ID
        required: true
        default: '34619884676'
      built_commit:
        description: Exact source commit used by that paper build
        required: true
        default: 'bbd451e43b2530907d34745efaf138c29640fab9'
permissions:
  contents: read
concurrency:
  group: explicability-package-paper
  cancel-in-progress: false
jobs:
  package:
    if: github.ref == 'refs/heads/explicability'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    env:
      BUILD_RUN: ${{ inputs.build_run_id || '34619884676' }}
      BUILT_COMMIT: ${{ inputs.built_commit || 'bbd451e43b2530907d34745efaf138c29640fab9' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: explicability
          fetch-depth: 0
      - name: Validate source build identity before retrieving its artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, re, urllib.request
          run, commit = os.environ['BUILD_RUN'], os.environ['BUILT_COMMIT']
          if not run.isdigit() or not re.fullmatch('[0-9a-f]{40}', commit):
              raise ValueError('Invalid build identifiers')
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run}"
          req = urllib.request.Request(url, headers={'Authorization': 'Bearer '+os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(req, timeout=30) as r: record = json.load(r)
          if (record['head_sha'] != commit or record['head_branch'] != 'explicability'
              or record['conclusion'] != 'success' or record['path'] != '.github/workflows/explicability-paper.yml'):
              raise ValueError('Artifact is not from the expected successful branch-isolated manuscript build')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: explicability-paper-review
          run-id: ${{ env.BUILD_RUN }}
          github-token: ${{ github.token }}
          path: /tmp/manuscript-review
      - name: Preserve original and stage only verified generated manuscript files
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          source = os.environ['BUILT_COMMIT']
          original = '1643db7a82f111f1a468dba986fe29593761b6be'
          root = pathlib.Path('paper/explicability')
          bundle = pathlib.Path('/tmp/manuscript-review')
          def git_file(commit, name):
              return subprocess.check_output(['git','show',f'{commit}:{name}'])
          def hash_bytes(data): return hashlib.sha256(data).hexdigest()
          sources = {}
          for name in ['paper/explicability/main.tex','paper/explicability/references.bib']:
              built = git_file(source, name)
              if pathlib.Path(name).read_bytes() != built:
                  raise ValueError(f'Manuscript source changed since this artifact was built: {name}')
              sources[name] = hash_bytes(built)
          pdf, text = (bundle/'main.pdf').read_bytes(), (bundle/'main.txt').read_text()
          if not pdf.startswith(b'%PDF-') or 'Controlled Comparisons and Shared Failure Analysis' not in text.replace('\n',' '):
              raise ValueError('Unexpected manuscript artifact')
          archive = pathlib.Path('paper/original-sibgrapi.pdf')
          original_bytes = git_file(original, 'paper.pdf')
          if archive.exists() and archive.read_bytes() != original_bytes:
              raise ValueError('An existing archived manuscript differs; refusing to replace it')
          archive.write_bytes(original_bytes)
          pathlib.Path('paper.pdf').write_bytes(pdf)
          (root/'main.pdf').write_bytes(pdf)
          (root/'main.txt').write_text(text)
          log = (bundle/'main.log').read_text()
          report = {'built_commit': source, 'build_run_id': int(os.environ['BUILD_RUN']),
              'source_sha256': sources, 'pdf_sha256': hash_bytes(pdf),
              'original_source_commit': original, 'original_pdf_sha256': hash_bytes(original_bytes),
              'pages': len([p for p in text.split('\f') if p.strip()]),
              'layout_warnings': [line for line in log.splitlines() if 'Overfull' in line],
              'research_status': 'pre-execution revision; no new image XAI results',
              'branch': 'explicability'}
          (root/'build.json').write_text(json.dumps(report, indent=2)+'\n')
          print(json.dumps(report, indent=2))
          PY
      - name: Commit only generated files to explicability; no merge and no force push
        run: |
          test "$GITHUB_REF" = refs/heads/explicability
          test "$(git branch --show-current)" = explicability
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- paper.pdf paper/original-sibgrapi.pdf paper/explicability/main.pdf paper/explicability/main.txt paper/explicability/build.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'paper: include compiled XAI revision and preserve original SIBGRAPI manuscript'
          git push origin HEAD:refs/heads/explicability
