name: Inspect pinned paper evidence
on:
  push:
    branches: [paper-rewrite-20260923]
    paths: ['.github/workflows/paper-source-inspection.yml', 'paper/rewrite/inspect_evidence.py']
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'Lucas-PG/FaceForgery-Benchmark'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python -m pip install -q pymupdf pandas scikit-learn
      - name: Read actual seed records and reconcile methods
        run: python paper/rewrite/inspect_evidence.py
