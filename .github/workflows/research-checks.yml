name: Robust generalization CPU checks
on:
  push:
    branches: [robust-generalization]
    paths: ['src/robustness/**', 'tests/robustness/**', 'research_cli.py', 'configs/research/**', 'research/robustness/**', '.github/workflows/research-checks.yml']
  pull_request:
    branches: [ICLR]
    paths: ['src/robustness/**', 'tests/robustness/**', 'research_cli.py', 'configs/research/**', 'research/robustness/**', '.github/workflows/research-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: research-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    if: github.repository == 'Lucas-PG/FaceForgery-Benchmark'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Snapshot source for inspection
        run: |
          mkdir -p /tmp/research-checks
          git archive HEAD -o /tmp/research-checks/source.tar
          git rev-parse HEAD > /tmp/research-checks/commit.txt
          git ls-files > /tmp/research-checks/files.txt
      - name: Install CPU-only verification environment
        run: |
          python -m pip install 'torch==2.5.1+cpu' 'torchvision==0.20.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==2.4.4' 'pandas==3.0.2' 'scikit-learn==1.8.0' 'pyyaml==6.0.3' 'pytest==9.1.1' 'timm==1.0.27' 'transformers==5.14.1' 'captum==0.9.0' 'matplotlib==3.10.8' 'opencv-python-headless==4.13.0.92' 'seaborn==0.13.2'
      - name: Bounded software checks; no source images or checkpoints
        run: |
          set -o pipefail
          python -m compileall -q src scripts
          if [ -d tests/robustness ]; then
            timeout 240s python -m pytest tests/robustness -q --junitxml=/tmp/research-checks/junit.xml 2>&1 | tee /tmp/research-checks/tests.txt
            python research_cli.py --help
          fi
          python -m pip freeze > /tmp/research-checks/environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-cpu-checks
          path: /tmp/research-checks/
          retention-days: 14
          if-no-files-found: error
